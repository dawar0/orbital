services:
  api:
    build:
      context: ./backend
      target: api
    ports:
      - "8000:8080"
    env_file:
      - ./backend/.env
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_URL=redis://redis:6379

  worker:
    build:
      context: ./backend
      target: worker
    env_file:
      - ./backend/.env
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_URL=redis://redis:6379

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:8080"
    depends_on:
      - api

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
