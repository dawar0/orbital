[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ag-ui-langgraph>=0.0.28",
    "alembic>=1.18.4",
    "copilotkit>=0.1.84a1",
    "fastapi[standard]>=0.135.2",
    "langchain>=1.2.10",
    "langgraph>=1.0.10",
    "pgvector>=0.4.2",
    "psycopg[binary]>=3.3.3",
    "pydantic-settings>=2.13.1",
    "pydantic>=2.13.0b3",
    "rq>=2.7.0",
    "sqlalchemy>=2.0.48",
    "supabase>=2.28.3",
    "langchain-google-genai>=4.2.1",
    "uuid6>=2025.0.1",
    "pypdf>=6.9.2",
    "langchain-text-splitters>=1.1.1",
    "ty>=0.0.27",
    "langchain-anthropic>=1.4.0",
    "loguru>=0.7.3",
]

[project.scripts]
worker = "app.jobs.worker:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[dependency-groups]
dev = [
    "ruff>=0.15.9",
]
